name: 🐛 Bug report
description: tidy_imports did something wrong, crashed, or fought another tool
title: "[Bug]: "
labels: ["bug"]
assignees: ["Franklyn-R-Silva"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Only the first box is required — a short report
        is better than none, and follow-up questions are fine.
        Not sure it is a bug? Ask in [Discussions](https://github.com/Franklyn-R-Silva/tidy_imports/discussions/categories/q-a).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The command you ran, what it did, and what you expected instead.
      placeholder: Running `dart run tidy_imports` on the file below produced ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample
      description: The smallest Dart file (or config / pubspec snippet) that shows it. This is what makes a fix fast.
      render: dart
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`dart run tidy_imports --version` and `dart --version`, if you have them handy."
      placeholder: "tidy_imports 2.7.0, Dart 3.13.5"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
