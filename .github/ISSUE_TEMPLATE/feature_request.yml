name: ✨ Feature request
description: Suggest an idea or improvement for tidy_imports
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that tidy_imports doesn't support? A problem without a solution is a fine request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Optional. A flag, a config key, a new default? Say if you'd like to send the PR yourself.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Optional. The before/after, or the config you'd expect.
      render: yaml
