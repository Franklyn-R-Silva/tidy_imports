name: publish

# Publishes to pub.dev over OIDC — no long-lived pub.dev token lives here.
#
# ONE one-time precondition:
#
#   pub.dev -> tidy_imports -> Admin -> Automated publishing:
#     Repository:  Franklyn-R-Silva/tidy_imports
#     Tag pattern: v{{version}}
#
# Without it this job fails with a permission error and nothing is published;
# `dart pub publish` by hand still works.
#
# Tags are pushed by a person now, and a person's push does trigger workflows —
# unlike a push made with the default GITHUB_TOKEN, which is why the automated
# release of v1.5.0 never reached this file. See CONTRIBUTING.md for the steps.
#
# workflow_dispatch is kept as an escape hatch: pick the tag in the
# "Use workflow from" dropdown to publish a tag that already exists.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

jobs:
  publish:
    permissions:
      id-token: write # Required to mint the OIDC token pub.dev verifies.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
