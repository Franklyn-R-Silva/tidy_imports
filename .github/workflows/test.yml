name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Versions are bumped by hand, so nothing else stops pubspec.yaml,
      # lib/src/version.dart and CHANGELOG.md from drifting apart. Ordering is
      # checked too: pub.dev renders the changelog top-down, so a section in
      # the wrong place advertises the wrong version as current.
      - name: Check version sync
        run: dart run tool/check_version_sync.dart

      - name: Run tests with coverage
        run: |
          dart pub global activate coverage
          dart test --coverage=.coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=.coverage --out=lcov.info --report-on=lib

      - name: Check coverage
        run: dart run tool/check_coverage.dart lcov.info 85

      # Catches packaging problems — a missing file, a bad pubspec, an oversized
      # archive — on the PR instead of at release time, when the version is
      # already tagged and the mistake is permanent.
      - name: Validate the published package
        run: dart pub publish --dry-run
