name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Nothing here writes to the repository; a job that ever needs to asks for it.
permissions:
  contents: read

# A new push to a PR makes the run in progress obsolete. Runs on main are never
# cancelled, so every merge keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      # Versions are bumped by hand, so nothing else stops pubspec.yaml,
      # lib/src/version.dart and CHANGELOG.md from drifting apart. Ordering is
      # checked too: pub.dev renders the changelog top-down, so a section in
      # the wrong place advertises the wrong version as current.
      - name: Check version sync
        run: dart run tool/check_version_sync.dart

      # Catches packaging problems — a missing file, a bad pubspec, an oversized
      # archive — on the PR instead of at release time, when the version is
      # already tagged and the mistake is permanent.
      - name: Validate the published package
        run: dart pub publish --dry-run

  test:
    # The check names `test (stable)` and `test (beta)` are required by the
    # branch ruleset; `label` keeps them and only decorates the extra entry.
    name: test (${{ matrix.sdk }})${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Normally ~2.5 min; the CLI tests spawn processes, and a hung one would
    # otherwise hold the runner for GitHub's six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
        os: [ubuntu-latest]
        label: ['']
        # Path-separator bugs kept surfacing on the maintainer's machine and
        # nowhere in CI: the registrant check, pattern matching, node names.
        include:
          - sdk: stable
            os: windows-latest
            label: ' on windows'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        if: matrix.sdk != 'stable' || matrix.os != 'ubuntu-latest'
        run: dart test

      - name: Run tests with coverage
        if: matrix.sdk == 'stable' && matrix.os == 'ubuntu-latest'
        run: |
          dart pub global activate coverage
          dart test --coverage=.coverage
          dart pub global run coverage:format_coverage \
            --lcov --in=.coverage --out=lcov.info --report-on=lib

      - name: Check coverage
        if: matrix.sdk == 'stable' && matrix.os == 'ubuntu-latest'
        run: dart run tool/check_coverage.dart lcov.info 85

  min-sdk:
    name: min SDK (3.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: "3.0.0"

      # pubspec.yaml promises `sdk: >=3.0.0`, and nothing verified it. The
      # suite itself cannot run here — `lints ^6.0.0` needs Dart 3.8 — but a
      # dev dependency is not something users install. So the floor is checked
      # the way they actually meet it: a package that depends on this one,
      # resolved and run on the oldest SDK the pubspec claims to support.
      - name: Resolve and run as a consumer would
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          cat > pubspec.yaml <<YAML
          name: consumer
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dev_dependencies:
            tidy_imports:
              path: $GITHUB_WORKSPACE
          YAML
          dart pub get
          dart run tidy_imports --version

  pana:
    name: pana
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: stable

      # pub.dev scores every upload with pana, and a lost point is only seen
      # after the version is published for good. It checks what the jobs above
      # do not: dartdoc coverage of the public API, that the lower bounds of the
      # dependency constraints still resolve and analyze, and platform support.
      # Unpinned on purpose: pub.dev always scores with the latest pana.
      # Threshold 0 = fail on any point below the maximum (160/160 today).
      # pana converts the pubspec `screenshots:` to WebP; without these tools
      # it scores the example/screenshots section 0/10.
      - name: Score the package as pub.dev will
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp
          dart pub global activate pana
          dart pub global run pana --exit-code-threshold 0

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Dependabot alerts only fire once a vulnerable version is on main; this
      # stops a PR from bringing one in (a pub package or an action).
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
