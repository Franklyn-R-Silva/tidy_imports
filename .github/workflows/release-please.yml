name: Release Please

# Versioning 100% automated from Conventional Commits:
#   feat:      -> minor bump (x.Y.0)
#   fix:       -> patch bump (x.y.Z)
#   feat!:     -> major bump (X.0.0)
#   BREAKING CHANGE: footer -> major bump
#   chore/docs/refactor/test/ci/build -> no version bump
#
# On every push to main, this action opens/updates a "Release PR" that
# bumps pubspec.yaml + lib/src/version.dart + CHANGELOG.md.
# Merging the Release PR creates the vX.Y.Z tag and GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
