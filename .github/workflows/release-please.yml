name: Release Please

# Versioning 100% automated from Conventional Commits:
#   feat:      -> minor bump (x.Y.0)
#   fix:       -> patch bump (x.y.Z)
#   feat!:     -> major bump (X.0.0)
#   BREAKING CHANGE: footer -> major bump
#   chore/docs/refactor/test/ci/build -> no version bump
#
# On every push to main, this action opens/updates a "Release PR" that
# bumps pubspec.yaml + lib/src/version.dart + CHANGELOG.md.
# Merging the Release PR creates the vX.Y.Z tag and GitHub Release.
#
# NOTE: opening a PR from Actions requires ONE of:
#   (a) Settings -> Actions -> General -> Workflow permissions ->
#       enable "Allow GitHub Actions to create and approve pull requests", OR
#   (b) a Personal Access Token stored as the RELEASE_PLEASE_TOKEN secret
#       (repo scope) — used automatically below when present.
# The default GITHUB_TOKEN alone cannot open PRs while (a) is disabled.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Prefer a PAT if provided (works even when the repo setting is off);
          # otherwise fall back to the default token (needs the repo setting on).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
